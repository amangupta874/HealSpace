<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - HealSpace</title>
    <link rel="stylesheet" href="project3.css">
</head>
<body>
    <header class="header">
        <a href="index.html" class="logo">Heal<span>Space</span></a>
    </header>

    <main class="login-wrapper">
        <form id="login" onsubmit="event.preventDefault();">
            <h1>Sign in</h1>
            <p id="logg">It's great to see you again</p>

            <div class="form-group">
                <label for="userInput" id="mob">Mobile / Email</label>
                <input type="text" id="userInput" name="userInput" placeholder="Mobile number or email" required autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password" id="pas">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
            </div>

            <button id="submit" type="submit">Sign in</button>
            <a href="index2.html" id="Sign-link">
                <button id="Sign" type="button">New here? <span>Create a free account</span></button>
            </a>
        </form>
    </main>
</body>
</html>
